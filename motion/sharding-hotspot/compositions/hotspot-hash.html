 .query,.batch,.range,.token{font-family:"IBM Plex Mono",monospace}</style><div id="hotspot-hash" data-composition-id="hotspot-hash" data-width="960" data-height="640" data-duration="12"><div class="eyebrow">SHARDING / DISTRIBUIÇÃO DE ESCRITAS</div><h1>Seis IDs novos. Quem recebe?</h1><div class="inside">

</div></div><script>(()=>{const tl=gsap.timeline({paused:true});document.querySelectorAll('#hotspot-hash .lines path').forEach(p=>{const length=p.getTotalLength();p.style.strokeDasharray=String(length);p.style.strokeDashoffset=String(length);});tl.to('#hash-a, #hash-b, #hash-c',{strokeDashoffset:0,duration:1.2,ease:'none'},2);[901,902,903,904,905,906].forEach((id,i)=>tl.fromTo('#h'+id,{opacity:0,scale:0.8,y:-12},{opacity:1,scale:1,y:0,duration:0.65,ease:'power3.out'},3.5+i*1.05));window.__timelines['hotspot-hash']=tl;})();</script></template></body></html>
